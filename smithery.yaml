startCommand:
  type: http
  url: https://app.linkmcp.io/api/mcp?ref=smithery
  configSchema:
    type: object
    properties:
      token:
        type: string
        title: Personal Access Token
        description: >-
          Your LinkMCP access key (in the app under API Keys).
          Leave empty to use OAuth authentication instead.
        x-to:
          header: x-linkmcp-pat
    required: []
